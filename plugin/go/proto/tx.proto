syntax = "proto3";
package types;
option go_package = "github.com/Dremo15/canopy/plugin/go/contract";

import "google/protobuf/any.proto";

// Transaction represents a signed action submitted to the network
// THIS MUST MATCH lib.Transaction EXACTLY for signing
message Transaction {
  string message_type  = 1; // @gotags: json:"messageType"
  google.protobuf.Any msg = 2;
  Signature signature  = 3;
  uint64 created_height = 4; // @gotags: json:"createdHeight"
  uint64 time          = 5;
  uint64 fee           = 6;
  string memo          = 7;
  uint64 network_id    = 8; // @gotags: json:"networkID"
  uint64 chain_id      = 9; // @gotags: json:"chainID"
}

// MessageSend transfers tokens between accounts
message MessageSend {
  bytes  from_address = 1; // @gotags: json:"fromAddress"
  bytes  to_address   = 2; // @gotags: json:"toAddress"
  uint64 amount       = 3;
}

// FeeParams governs minimum fees
message FeeParams {
  uint64 send_fee = 1; // @gotags: json:"sendFee"
  // NO CONFLICT STARTING AT FIELD = 14
}

// Signature holds a BLS12-381 public key and signature
message Signature {
  bytes public_key = 1; // @gotags: json:"publicKey"
  bytes signature  = 2;
}

// ── OPEC Transaction Messages ─────────────────────────────────────────────────

// MessageTokenizeAsset registers a real-world asset on-chain and mints fractions.
// 1.5% of fractions go to the OPEC treasury automatically.
message MessageTokenizeAsset {
  bytes  owner_address   = 1; // @gotags: json:"ownerAddress"   20 bytes
  string asset_name      = 2; // @gotags: json:"assetName"      1-128 chars
  string asset_type      = 3; // @gotags: json:"assetType"      e.g. "real_estate"
  string metadata_uri    = 4; // @gotags: json:"metadataURI"    off-chain reference
  uint64 total_fractions = 5; // @gotags: json:"totalFractions" >= 2
  uint64 fraction_price  = 6; // @gotags: json:"fractionPrice"  price per fraction in uOPEC
}

// MessageBuyFraction purchases fractions from the asset owner.
// Cost = quantity * fraction_price. 1.5% platform fee to treasury.
message MessageBuyFraction {
  bytes  buyer_address = 1; // @gotags: json:"buyerAddress" 20 bytes
  uint64 asset_id      = 2; // @gotags: json:"assetId"
  uint64 quantity      = 3; // @gotags: json:"quantity"     >= 1
}

// MessageTransferFraction sends fractions peer-to-peer (secondary market).
message MessageTransferFraction {
  bytes  from_address = 1; // @gotags: json:"fromAddress" 20 bytes
  bytes  to_address   = 2; // @gotags: json:"toAddress"   20 bytes
  uint64 asset_id     = 3; // @gotags: json:"assetId"
  uint64 quantity     = 4; // @gotags: json:"quantity"    >= 1
}

// MessageDistributeYield fans yield out to all fraction holders of an asset.
// Caller must be the asset owner. Payout proportional to fractions held.
message MessageDistributeYield {
  bytes  owner_address = 1; // @gotags: json:"ownerAddress" 20 bytes
  uint64 asset_id      = 2; // @gotags: json:"assetId"
  uint64 total_yield   = 3; // @gotags: json:"totalYield"   >= 1
}

// MessageCastVote submits a DAO governance vote.
// Vote weight = total fractions held across all assets by the voter.
// Each address may only vote once per proposal.
message MessageCastVote {
  bytes  voter_address = 1; // @gotags: json:"voterAddress" 20 bytes
  uint64 proposal_id   = 2; // @gotags: json:"proposalId"
  bool   approve       = 3; // @gotags: json:"approve"
}

// ── OPEC State Objects ────────────────────────────────────────────────────────

// Asset is the on-chain record of a tokenized real-world asset.
message Asset {
  uint64 id              = 1;
  bytes  owner_address   = 2;
  string asset_name      = 3;
  string asset_type      = 4;
  string metadata_uri    = 5;
  uint64 total_fractions = 6;
  uint64 fraction_price  = 7;
  uint64 created_height  = 8;
}

// AssetCounter auto-increments to assign unique asset IDs.
message AssetCounter {
  uint64 count = 1;
}

// Holding records how many fractions of one asset a single address holds.
message Holding {
  bytes  holder_address = 1;
  uint64 asset_id       = 2;
  uint64 quantity       = 3;
}

// AssetHolderIndex lists all holder addresses for one asset (for yield fan-out).
message AssetHolderIndex {
  repeated bytes holder_addresses = 1;
}

// HoldingIndex lists all asset IDs held by one address (for vote weight calc).
message HoldingIndex {
  repeated uint64 asset_ids = 1;
}

// Proposal is a DAO governance proposal.
message Proposal {
  uint64 id             = 1;
  bytes  proposer       = 2;
  string description    = 3;
  uint64 yes_votes      = 4;
  uint64 no_votes       = 5;
  uint64 created_height = 6;
}

// ProposalCounter auto-increments to assign unique proposal IDs.
message ProposalCounter {
  uint64 count = 1;
}

// VoteRecord marks that an address has already voted on a proposal.
message VoteRecord {
  bool voted = 1;
}







